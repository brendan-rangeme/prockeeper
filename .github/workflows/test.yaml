name: Test

on:
  pull_request:
    branches:
      - master  # or your default branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22  # match your Go version
      - name: Run tests
        run: |
          go test ./... -v
