name: Release

on:
  push:
    tags:
      - 'v*'  # triggers on tags like v1.2.3

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: amd64  # macOS on amd64 is optional / deprecated

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -o dist/prockeeper-${GOOS}-${GOARCH}-${{ github.ref_name }}
          dist/prockeeper-${GOOS}-${GOARCH}-${{ github.ref_name }} --help
      - name: Upload release artifact
        uses: softprops/action-gh-release@v1
        with:
          files: dist/prockeeper-${{ matrix.goos }}-${{ matrix.goarch }}-${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
